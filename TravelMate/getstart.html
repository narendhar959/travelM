<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelMate - Explore the World</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #0a9dc5;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background:
        linear-gradient(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.08)),
        url("project images/project images/f5.jpg") center center / cover no-repeat;
    }

    .topbar {
      position: absolute;
      top: 20px;
      right: 28px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 112px;
      padding: 10px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      border: none;
      color: #fff;
      background: rgba(17, 209, 225, 0.95);
      box-shadow: 0 8px 18px rgba(10, 166, 190, 0.28);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .headline {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .headline .small {
      margin: 0;
      font-size: clamp(24px, 2vw, 40px);
      font-weight: 700;
      color: rgba(255,255,255,0.96);
      text-shadow: 0 2px 10px rgba(0,0,0,0.16);
    }

    .headline h1 {
      margin: 0;
      font-size: clamp(56px, 7vw, 128px);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 900;
      text-transform: uppercase;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      min-width: 150px;
      padding: 16px 30px;
      border-radius: 999px;
      background: rgba(18, 206, 212, 0.95);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 12px 22px rgba(10, 166, 190, 0.28);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .home-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    @media (max-width: 640px) {
      .topbar { right: 16px; top: 18px; }
      .btn { min-width: 92px; padding: 9px 14px; font-size: 13px; }
      .headline { transform: scale(0.9); }
    }
  </style>
</head>
<body>
  <div class="hero">
    <header class="topbar">
      <a href="login.html" class="btn">Log In</a>
      <a href="signup.html" class="btn">Sign Up</a>
    </header>

    <main class="content">
      <div class="headline">
        <p class="small">Travel Mate</p>
        <h1>Explore<br />The World</h1>
        <a href="main.html" class="home-btn">Home</a>
      </div>
    </main>
  </div>
</body>
</html>
