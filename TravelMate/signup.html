<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - TravelMate</title>
<link rel="stylesheet" href="popup-styles.css">
<link rel="stylesheet" href="auth-animations.css">
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: url('project images/project images/login.jpg.jpg') center / cover fixed no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    .container {
        background: rgba(255, 255, 255, 0.97);
        padding: 30px 40px;
        border-radius: 18px;
        width: 100%;
        max-width: 430px;
        color: #123c3c;
        box-shadow: 0 22px 54px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(10px);
    }

    .logo { text-align: center; color: #008080; font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .tagline { text-align: center; color: #5b6b6b; margin-bottom: 26px; font-size: 14px; }
    h2 { text-align: center; margin: 0 0 20px; color: #123c3c; font-size: 22px; }

    label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; color: #123c3c; }

    input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-top: 8px;
        border: 2px solid #dce9e9;
        border-radius: 10px;
        font-size: 16px;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #008080;
        box-shadow: 0 0 0 4px rgba(0, 128, 128, 0.14);
    }

    .form-row { display: flex; gap: 15px; }
    .form-group { flex: 1; min-width: 0; }

    .error-message, .success-message {
        padding: 10px;
        border-radius: 8px;
        margin-top: 15px;
        display: none;
        text-align: center;
        font-size: 14px;
        animation: ttAuthCardIn 0.3s ease both;
    }
    .error-message { background: #ffebee; color: #c62828; border: 1px solid #ef5350; }
    .success-message { background: #e8f5e8; color: #2e7d32; border: 1px solid #4caf50; }

    .signup-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 13px;
        margin-top: 20px;
        background: linear-gradient(135deg, #008080, #00a6a6);
        border: none;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(0, 128, 128, 0.28);
        transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
    }

    .signup-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0, 128, 128, 0.34); }
    .signup-btn:disabled { background: #9fb8b8; cursor: progress; transform: none; box-shadow: none; }

    .btn-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-top-color: #fff;
        border-radius: 50%;
        animation: btnSpin 0.8s linear infinite;
    }
    @keyframes btnSpin { to { transform: rotate(360deg); } }

    .otp-section {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #f4f9f9;
        border-radius: 12px;
        border: 1px solid #dce9e9;
        animation: ttAuthCardIn 0.35s ease both;
    }

    .otp-input { text-align: center; font-size: 18px; letter-spacing: 6px; font-weight: 700; }

    .resend-otp { color: #008080; cursor: pointer; text-decoration: underline; font-size: 14px; margin-top: 10px; display: inline-block; }

    p { text-align: center; margin-top: 20px; color: #5b6b6b; font-size: 14px; }
    a { color: #008080; text-decoration: none; font-weight: 700; }
    a:hover { text-decoration: underline; }

    .back-home { text-align: center; margin-top: 20px; }
    .back-home a { color: #008080; font-size: 14px; }

    .password-strength { margin-top: 5px; font-size: 12px; }
    .strength-weak { color: #f44336; }
    .strength-medium { color: #ff9800; }
    .strength-strong { color: #4caf50; }

    .otp-hint {
        background: #e3f2fd;
        color: #1565c0;
        padding: 10px;
        border-radius: 8px;
        margin-top: 10px;
        font-size: 12px;
        text-align: center;
    }
    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; color: #728181; font-size: 12px; }
    .auth-divider::before, .auth-divider::after { content: ''; height: 1px; flex: 1; background: #dce9e9; }
    .google-signin { min-height: 44px; display: flex; justify-content: center; }
    .google-status { min-height: 18px; margin: 9px 0 0; color: #5b6b6b; font-size: 12px; text-align: center; }
</style>
</head>
<body>

<div class="tt-auth-bg" aria-hidden="true">
    <span class="tt-auth-glow g1"></span>
    <span class="tt-auth-glow g2"></span>
    <span class="tt-auth-cloud c1"></span>
    <span class="tt-auth-cloud c2"></span>
</div>

<div class="container tt-auth-card">
    <div class="logo">TravelMate</div>
    <div class="tagline">Join the Travel Revolution</div>

    <h2>Create Account</h2>

    <form id="signupForm" novalidate>
        <div class="form-row">
            <div class="form-group">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" placeholder="Enter first name" required>
            </div>
            <div class="form-group">
                <label for="lastname">Last Name</label>
                <input type="text" id="lastname" placeholder="Enter last name" required>
            </div>
        </div>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>

        <div class="form-row">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="Enter your city" required>
            </div>
        </div>

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Choose a strong password" autocomplete="new-password" required>
        <div id="passwordStrength" class="password-strength"></div>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>

        <div class="error-message" id="errorMessage" role="alert"></div>
        <div class="success-message" id="successMessage" role="status"></div>

        <button type="submit" class="signup-btn" id="signupBtn">Send OTP</button>
    </form>

    <div class="auth-divider" aria-hidden="true">OR</div>
    <div class="google-signin" id="googleSignIn" aria-label="Continue with Google"></div>
    <div id="googleStatus" class="google-status" role="status" aria-live="polite"></div>

    <div class="otp-section" id="otpSection">
        <h3 style="text-align: center; color: #008080; margin: 0 0 12px;">Verify Your Email</h3>
        <p style="text-align: center; margin: 0 0 15px; font-size: 14px;">
            We've sent a 6-digit OTP to your email address
        </p>
        <input type="text" id="otpInput" class="otp-input" placeholder="Enter OTP" maxlength="6" inputmode="numeric">
        <div class="otp-hint">
            💡 For testing purposes, you can use: <strong>123456</strong>
        </div>
        <div style="text-align: center; margin-top: 15px;">
            <button type="button" class="signup-btn" id="verifyBtn" onclick="verifyOTP()">Verify &amp; Create Account</button>
        </div>
        <div style="text-align: center; margin-top: 10px;">
            <span class="resend-otp" onclick="resendOTP()">Resend OTP</span>
        </div>
    </div>

    <p>Already have an account? <a href="login.html" onclick="return tmAuthGoto(event, 'login.html')">Login here</a></p>

    <div class="back-home">
        <a href="getstart.html">← Back to Home</a>
    </div>
</div>

<script src="popup-manager.js"></script>
<script src="https://accounts.google.com/gsi/client" defer></script>
<script src="auth-google.js"></script>
<script>
    let generatedOTP = '';
    let formData = {};

    function tmAuthGoto(event, page) {
        event.preventDefault();
        document.documentElement.classList.add('tt-auth-leaving');
        setTimeout(() => { window.location.href = page; }, 260);
        return false;
    }

    // Password strength checker
    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        const strengthDiv = document.getElementById('passwordStrength');

        if (password.length === 0) {
            strengthDiv.textContent = '';
            return;
        }

        let strength = 0;
        if (password.length >= 8) strength++;
        if (/[a-z]/.test(password)) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;

        if (strength < 3) {
            strengthDiv.textContent = 'Weak password';
            strengthDiv.className = 'password-strength strength-weak';
        } else if (strength < 5) {
            strengthDiv.textContent = 'Medium strength';
            strengthDiv.className = 'password-strength strength-medium';
        } else {
            strengthDiv.textContent = 'Strong password';
            strengthDiv.className = 'password-strength strength-strong';
        }
    });

    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');

        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        formData = {
            firstname: document.getElementById('firstname').value.trim(),
            lastname: document.getElementById('lastname').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            gender: document.getElementById('gender').value,
            dob: document.getElementById('dob').value,
            city: document.getElementById('city').value.trim(),
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            confirmPassword: document.getElementById('confirmPassword').value
        };

        if (!validateForm()) return;

        sendOTP();
    });

    function validateForm() {
        const { firstname, lastname, email, phone, gender, dob, city, username, password, confirmPassword } = formData;

        if (!firstname || !lastname || !email || !phone || !gender || !dob || !city || !username || !password || !confirmPassword) {
            showErrorPopup('Validation Error', 'Please fill in all fields');
            return false;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showErrorPopup('Invalid Email', 'Please enter a valid email address');
            return false;
        }

        const phoneRegex = /^[0-9]{10}$/;
        if (!phoneRegex.test(phone.replace(/\D/g, ''))) {
            showErrorPopup('Invalid Phone', 'Please enter a valid 10-digit phone number');
            return false;
        }

        const birthDate = new Date(dob);
        const today = new Date();
        const age = today.getFullYear() - birthDate.getFullYear();
        if (age < 13) {
            showErrorPopup('Age Restriction', 'You must be at least 13 years old to create an account');
            return false;
        }

        if (username.length < 3) {
            showErrorPopup('Invalid Username', 'Username must be at least 3 characters long');
            return false;
        }

        if (password.length < 8) {
            showErrorPopup('Weak Password', 'Password must be at least 8 characters long');
            return false;
        }

        if (password !== confirmPassword) {
            showErrorPopup('Password Mismatch', 'Passwords do not match');
            return false;
        }

        const existingUsers = JSON.parse(localStorage.getItem('travelmate_users') || '[]');
        const userExists = existingUsers.find(u => u.email === email || u.username === username);

        if (userExists) {
            if (userExists.email === email) {
                showErrorPopup('Account Exists', 'An account with this email already exists');
            } else {
                showErrorPopup('Username Taken', 'This username is already taken');
            }
            return false;
        }

        return true;
    }

    function sendOTP() {
        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
        console.log('Generated OTP:', generatedOTP); // testing aid

        const signupBtn = document.getElementById('signupBtn');
        const otpSection = document.getElementById('otpSection');

        signupBtn.disabled = true;
        signupBtn.innerHTML = '<span class="btn-spinner"></span>Sending OTP...';

        setTimeout(() => {
            signupBtn.innerHTML = 'OTP Sent';
            otpSection.style.display = 'block';
            showSuccessPopup('OTP Sent', `OTP sent to ${formData.email}. Check your email and enter the 6-digit code below. For testing, you can use: 123456`);
            setTimeout(() => { document.getElementById('otpInput').focus(); }, 120);
        }, 500);
    }

    function verifyOTP() {
        const enteredOTP = document.getElementById('otpInput').value.trim();
        const verifyBtn = document.getElementById('verifyBtn');

        if (!enteredOTP) {
            showErrorPopup('Missing OTP', 'Please enter the OTP');
            return;
        }

        if (enteredOTP !== generatedOTP && enteredOTP !== '123456') {
            showErrorPopup('Invalid OTP', 'Invalid OTP. Please try again or use 123456 for testing.');
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '<span class="btn-spinner"></span>Creating account...';

        setTimeout(createAccount, 500);
    }

    function createAccount() {
        const existingUsers = JSON.parse(localStorage.getItem('travelmate_users') || '[]');

        const newUser = {
            id: Date.now(),
            firstname: formData.firstname,
            lastname: formData.lastname,
            fullname: `${formData.firstname} ${formData.lastname}`,
            email: formData.email,
            phone: formData.phone,
            gender: formData.gender,
            dob: formData.dob,
            city: formData.city,
            username: formData.username,
            password: formData.password,
            createdAt: new Date().toISOString(),
            isVerified: true
        };

        existingUsers.push(newUser);
        localStorage.setItem('travelmate_users', JSON.stringify(existingUsers));
        localStorage.setItem('travelmate_current_user', JSON.stringify(newUser));

        showProfilePopup('register', newUser);
    }

    function resendOTP() {
        sendOTP();
    }

    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        document.getElementById('successMessage').style.display = 'none';
    }

    function showSuccess(message) {
        const successDiv = document.getElementById('successMessage');
        successDiv.textContent = message;
        successDiv.style.display = 'block';
        document.getElementById('errorMessage').style.display = 'none';
    }

    // Set max date for DOB (must be at least 13 years old)
    const today = new Date();
    const maxDate = new Date(today.getFullYear() - 13, today.getMonth(), today.getDate());
    document.getElementById('dob').max = maxDate.toISOString().split('T')[0];
</script>

</body>
</html>
