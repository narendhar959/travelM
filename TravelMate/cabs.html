<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelMate - Cab Booking</title>
  <link rel="stylesheet" href="booking-modal.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f0f8ff 0%, #f8f9fa 100%);
      min-height: 100vh;
    }

    .header {
      background: #008080;
      color: white;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .booking-card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .service-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f0f0f0;
    }

    .service-icon {
      font-size: 48px;
      color: #008080;
    }

    .service-title {
      font-size: 28px;
      font-weight: bold;
      color: #008080;
    }

    .trip-type {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .trip-option {
      flex: 1;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .trip-option.selected {
      border-color: #008080;
      background: #e8f5f5;
      color: #008080;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    .form-group input, .form-group select {
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #008080;
      box-shadow: 0 0 10px rgba(0,128,128,0.1);
    }

    .location-input {
      position: relative;
    }

    .swap-btn {
      position: absolute;
      right: -15px;
      top: 50%;
      transform: translateY(-50%);
      background: #008080;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
      z-index: 10;
    }

    .search-btn {
      background: linear-gradient(45deg, #008080, #00a0a0);
      color: white;
      border: none;
      padding: 18px 40px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,128,128,0.3);
    }

    .search-results {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin-top: 30px;
      display: none;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border: 2px solid #f0f0f0;
      border-radius: 10px;
      margin-bottom: 15px;
      transition: all 0.3s;
    }

    .result-item:hover {
      border-color: #008080;
      box-shadow: 0 2px 8px rgba(0,128,128,0.1);
    }

    .cab-info {
      flex: 1;
    }

    .cab-route {
      font-size: 18px;
      font-weight: bold;
      color: #008080;
      margin-bottom: 5px;
    }

    .cab-details {
      color: #666;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .cab-price {
      font-size: 20px;
      font-weight: bold;
      color: #28a745;
      margin-right: 20px;
    }

    .book-btn {
      background: #008080;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .book-btn:hover {
      background: #006666;
      transform: translateY(-2px);
    }

    .popular-routes {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .section-title {
      color: #008080;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }

    .routes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .route-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    .route-card:hover {
      border-color: #008080;
      transform: translateY(-2px);
    }

    /* Message Box Styles */
    .message-box {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border-left: 5px solid #008080;
      z-index: 1000;
      max-width: 400px;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .message-box.show {
      transform: translateX(0);
    }

    .message-box.error {
      border-left-color: #dc3545;
    }

    .message-box.success {
      border-left-color: #28a745;
    }

    .message-box .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #666;
    }

    .message-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .message-content {
      color: #666;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .trip-type {
        flex-direction: column;
      }
      
      .result-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .message-box {
        top: 10px;
        right: 10px;
        left: 10px;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="main.html" class="back-btn">← Back</a>
    <h1>🚗 Cab Booking</h1>
    <p>Find the best deals for cabs</p>
  </div>

  <div class="container">
    <div class="booking-card">
      <div class="service-header">
        <div class="service-icon">🚗</div>
        <div class="service-title">Book Cabs</div>
      </div>

      <div class="trip-type">
        <div class="trip-option selected" onclick="selectCabType('oneway')">
          <strong>One Way</strong>
        </div>
        <div class="trip-option" onclick="selectCabType('roundtrip')">
          <strong>Round Trip</strong>
        </div>
        <div class="trip-option" onclick="selectCabType('local')">
          <strong>Local</strong>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group location-input">
          <label for="from">Pickup Location</label>
          <input type="text" id="from" placeholder="Pickup address" list="cities">
          <button class="swap-btn" onclick="swapLocations()" title="Swap locations">⇄</button>
        </div>
        
        <div class="form-group">
          <label for="to">Drop Location</label>
          <input type="text" id="to" placeholder="Drop address" list="cities">
        </div>
        
        <div class="form-group">
          <label for="date">Pickup Date</label>
          <input type="date" id="date">
        </div>
        
        <div class="form-group">
          <label for="time">Pickup Time</label>
          <input type="time" id="time">
        </div>
        
        <div class="form-group">
          <label for="cartype">Car Type</label>
          <select id="cartype">
            <option value="hatchback">Hatchback</option>
            <option value="sedan">Sedan</option>
            <option value="suv">SUV</option>
            <option value="luxury">Luxury</option>
          </select>
        </div>
      </div>

      <button class="search-btn" onclick="searchCabs()">
        🔍 Search Cabs
      </button>
    </div>

    <div class="search-results" id="search-results">
      <div class="section-title">Available Cabs</div>
      <div id="results-container"></div>
    </div>

    <div class="popular-routes">
      <div class="section-title">Popular Cab Services</div>
      <div class="routes-grid">
        <div class="route-card" onclick="quickSelect('Airport', 'City Center')">
          <div style="font-weight: bold; color: #008080;">Airport → City Center</div>
          <div style="color: #28a745;">Starting ₹350</div>
        </div>
        <div class="route-card" onclick="quickSelect('Railway Station', 'Hotel')">
          <div style="font-weight: bold; color: #008080;">Railway Station → Hotel</div>
          <div style="color: #28a745;">Starting ₹250</div>
        </div>
        <div class="route-card" onclick="quickSelect('City Tour', '8 hours')">
          <div style="font-weight: bold; color: #008080;">City Tour (8 hours)</div>
          <div style="color: #28a745;">Starting ₹1,200</div>
        </div>
        <div class="route-card" onclick="quickSelect('Outstation', '100 km')">
          <div style="font-weight: bold; color: #008080;">Outstation (100 km)</div>
          <div style="color: #28a745;">Starting ₹2,000</div>
        </div>
      </div>
    </div>
  </div>

  <datalist id="cities">
    <option value="Airport">
    <option value="Railway Station">
    <option value="Bus Stand">
    <option value="City Center">
    <option value="Hotel">
    <option value="Mall">
    <option value="Hospital">
    <option value="Office Complex">
  </datalist>

  <script src="booking-modal.js"></script>
  <script>
    let currentCabType = 'oneway';

    function selectCabType(type) {
      document.querySelectorAll('.trip-option').forEach(opt => opt.classList.remove('selected'));
      event.target.classList.add('selected');
      currentCabType = type;
    }

    function swapLocations() {
      const fromField = document.getElementById('from');
      const toField = document.getElementById('to');
      
      const temp = fromField.value;
      fromField.value = toField.value;
      toField.value = temp;
    }

    function quickSelect(from, to) {
      document.getElementById('from').value = from;
      document.getElementById('to').value = to;
    }

    function showMessage(title, message, type = 'info') {
      // Remove existing message box
      const existingBox = document.querySelector('.message-box');
      if (existingBox) {
        existingBox.remove();
      }

      const messageBox = document.createElement('div');
      messageBox.className = `message-box ${type}`;
      messageBox.innerHTML = `
        <button class="close-btn" onclick="this.parentElement.remove()">×</button>
        <div class="message-title">${title}</div>
        <div class="message-content">${message}</div>
      `;

      document.body.appendChild(messageBox);

      // Show with animation
      setTimeout(() => {
        messageBox.classList.add('show');
      }, 100);

      // Auto-remove after 5 seconds
      setTimeout(() => {
        if (messageBox.parentElement) {
          messageBox.classList.remove('show');
          setTimeout(() => messageBox.remove(), 300);
        }
      }, 5000);
    }

    function searchCabs() {
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      
      if (!from || !to || !date || !time) {
        showMessage('Missing Information', 'Please fill in all required fields (Pickup Location, Drop Location, Date, and Time)', 'error');
        return;
      }
      
      showSearchResults(from, to, date, time);
      showMessage('Search Complete', `Found cabs for your trip from ${from} to ${to}`, 'success');
    }

    function showSearchResults(from, to, date, time) {
      const resultsContainer = document.getElementById('results-container');
      const searchResults = document.getElementById('search-results');
      
      const providers = ['Uber', 'Ola', 'Meru Cabs', 'Easy Cabs', 'Taxi For Sure'];
      const results = [];
      
      for (let i = 0; i < 5; i++) {
        const provider = providers[i];
        const price = 300 + (Math.random() * 500);
        const eta = `${5 + i * 2} mins`;
        
        results.push({
          id: `CB${Date.now()}_${i}`,
          provider: provider,
          route: `${from} → ${to}`,
          eta: eta,
          duration: '45 mins',
          price: Math.round(price),
          date: date,
          time: time
        });
      }
      
      resultsContainer.innerHTML = '';
      results.forEach(cab => {
        const resultItem = document.createElement('div');
        resultItem.className = 'result-item';
        resultItem.innerHTML = `
          <div class="cab-info">
            <div class="cab-route">${cab.route}</div>
            <div class="cab-details">${cab.provider} • ETA: ${cab.eta}</div>
            <div class="cab-details">${cab.duration} • ${new Date(cab.date).toLocaleDateString()} ${cab.time}</div>
          </div>
          <div class="cab-price">₹${cab.price.toLocaleString()}</div>
          <button class="book-btn" onclick="bookCab('${cab.id}', '${cab.price}', '${from}', '${to}', '${date}', '${cab.provider}', '${time}')">
            Book Now
          </button>
        `;
        resultsContainer.appendChild(resultItem);
      });
      
      searchResults.style.display = 'block';
      searchResults.scrollIntoView({ behavior: 'smooth' });
    }

    function bookCab(id, price, from, to, date, provider, time) {
      const user = JSON.parse(localStorage.getItem('travelmate_current_user') || 'null');
      
      if (!user) {
        showMessage('Login Required', 'Please login to book cabs. Redirecting to login page...', 'error');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        return;
      }
      
      const cabData = {
        id: id,
        type: 'cab',
        title: `${provider} Cab`,
        from: from,
        to: to,
        date: date,
        time: time,
        price: `₹${price}`,
        provider: provider
      };
      
      // Show booking modal instead of alert
      window.showBookingModal(cabData);
    }

    document.addEventListener('DOMContentLoaded', function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').min = today;
      
      const now = new Date();
      const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
      document.getElementById('time').value = timeString;
    });
  </script>
  <script src="travel-transitions.js"></script>
  <script src="travel-message.js"></script>
</body>
</html>
