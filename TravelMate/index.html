<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelMate | Explore the World</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #c2d7df;
      color: #fff;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background:
        linear-gradient(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.08)),
        url('project images/project images/f5.jpg') center center / cover no-repeat;
    }

    .topbar {
      position: absolute;
      top: 18px;
      right: 22px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      background: linear-gradient(135deg, #19cfe2, #0eb2d5);
      box-shadow: 0 8px 18px rgba(8, 151, 183, 0.22);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 12px;
    }

    .headline-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .subtitle {
      margin: 0;
      font-size: clamp(18px, 2vw, 36px);
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 4px 12px rgba(0,0,0,0.12);
    }

    .main-title {
      margin: 0;
      font-size: clamp(60px, 8vw, 150px);
      line-height: 0.88;
      letter-spacing: -0.06em;
      font-weight: 900;
      text-transform: uppercase;
      color: rgba(255,255,255,0.96);
      text-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      min-width: 150px;
      padding: 16px 30px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      background: linear-gradient(135deg, #2ecfe2, #1caec9);
      box-shadow: 0 12px 20px rgba(16, 167, 202, 0.24);
    }

    @media (max-width: 640px) {
      .topbar {
        left: 12px;
        top: 12px;
        gap: 10px;
      }

      .btn {
        min-width: 88px;
        padding: 10px 16px;
        font-size: 13px;
      }

      .headline-wrap { transform: scale(0.84); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="login.html" class="btn">Log In</a>
      <a href="signup.html" class="btn">Sign Up</a>
    </header>

    <main class="content">
      <div class="headline-wrap">
        <p class="subtitle">Travel Mate</p>
        <h1 class="main-title">Explore<br />The World</h1>
        <a href="main.html" class="home-btn">Home</a>
      </div>
    </main>
  </div>
</body>
</html>
